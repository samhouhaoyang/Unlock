name: PR dependencies

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: dependencies-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  issue-dependencies:
    name: issue-dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Run policy from the target branch. No skipped push job can satisfy this check.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Require an issue with closed prerequisites
        run: node scripts/check-pr-dependencies.mjs
        env:
          GH_TOKEN: ${{ github.token }}
